# ローカル開発環境（DB + アプリ）
# プロジェクト名を固定（フォルダ移動でボリューム名が変わりDBデータを見失うのを防ぐ）
name: product-db

services:
  db:
    image: postgres:16-alpine
    container_name: product-db-postgres
    environment:
      POSTGRES_USER: productdb
      POSTGRES_PASSWORD: productdb-local
      POSTGRES_DB: productdb
    ports:
      - "5434:5432"
    volumes:
      - product-db-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productdb"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: product-db-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://productdb:productdb-local@db:5432/productdb
      PORT: 8080
      UPLOADS_DIR: /app/uploads
    ports:
      - "8081:8080"
    volumes:
      - product-db-uploads:/app/uploads
    # 起動時にマイグレーション適用 → seed → サーバ起動
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && node dist/index.js"

volumes:
  product-db-pgdata:
  product-db-uploads:
